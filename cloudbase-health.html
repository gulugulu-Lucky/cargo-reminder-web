<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <title>CloudBase 直连测试</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0f14;color:#f7f8fb;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;padding:24px}.card{width:min(560px,100%);background:#121821;border:1px solid #273140;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.28)}.ok{font-size:48px}.title{font-size:26px;font-weight:800;margin:12px 0}.sub{color:#95a0af;line-height:1.65}.pill{display:inline-block;margin-top:18px;padding:10px 14px;border-radius:999px;background:rgba(79,209,165,.12);color:#72e2bd;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <div class="ok">✅</div>
    <div class="title">CloudBase 直连测试成功</div>
    <div class="sub">如果你是在手机关闭 VPN 的情况下看到这个页面，说明腾讯 CloudBase 的默认静态托管域名在当前网络可以直接访问。</div>
    <div class="pill">下一步：迁移 API / 数据库 / 定时提醒</div>
  </main>
</body>
</html>
